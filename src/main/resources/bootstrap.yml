spring:
  application:
    name: "payment-api"
  datasource:
    url: jdbc:postgresql://postgres:5432/pagamentodb
    username: myuser
    password: secret
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 100
      connection-timeout: 5000
      idle-timeout: 30000
      minimum-idle: 20
      max-lifetime: 120000
      pool-name: HikariPool-PaymentApi
  flyway:
    url: jdbc:postgresql://postgres:5432/pagamentodb
    user: myuser
    password: secret
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  kafka:
    bootstrap-servers: kafka:9092
    listener:
      ack-mode: manual
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      max-poll-records: 100
      session-timeout-ms: 30000
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
    properties:
      reconnect:
        backoff:
          ms: 100
      retry:
        backoff:
          ms: 100

pagamento:
  producer:
    pagamento:
      topico: pagamento-v1

# Cada feature que reage a pagamentos consome o mesmo tópico com seu próprio grupo
notificacao:
  consumer:
    pagamento:
      topico: pagamento-v1
      group-id: ${spring.application.name}_notificacao
      concurrency: 1

# Actuator - Expor métricas
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    enable:
      all: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
